<form [formGroup]="userForm">
    <mat-card-content>
        
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input formControlName="name" matInput>
            <mat-icon matSuffix>person_2</mat-icon>
            <mat-hint *ngIf="userForm.controls['name'].dirty && userForm.hasError('required', 'name')">Name is required</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input formControlName="username" matInput>
            <mat-icon matSuffix>badge</mat-icon>
            <mat-hint *ngIf="userForm.controls['username'].dirty && userForm.hasError('required', 'username')">Username is required</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input formControlName="email" matInput>
            <mat-icon matSuffix>attach_email</mat-icon>
            <mat-hint *ngIf="userForm.controls['email'].dirty && userForm.hasError('required', 'email')">Email is required</mat-hint>
        </mat-form-field>

        <div class="adress-section">
            <mat-form-field appearance="outline">
                <mat-label>Street</mat-label>
                <input formControlName="street" matInput>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Suite</mat-label>
                <input formControlName="suite" matInput>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>City</mat-label>
                <input formControlName="city" matInput>
                <mat-icon matSuffix>house</mat-icon>
            </mat-form-field>
        </div>        

        <mat-form-field>
            <mat-label>Company</mat-label>
            <mat-select formControlName="company">
                @for (company of companies; track company) {
                    <mat-option [value]="company">{{ company }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input formControlName="phone" matInput>
            <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Website</mat-label>
            <input formControlName="website" matInput>
            <mat-icon matSuffix>web</mat-icon>
        </mat-form-field>
       

    @if (typeButton === 'sign-up') {
        <mat-card-actions>
            <button [disabled]="userForm.invalid" matButton="filled" (click)="userSignUp()" type="submit">Sign up</button>
        </mat-card-actions>
    } @else {
        <mat-card-actions>
            <button [disabled]="userForm.invalid" matButton="filled" (click)="userUpdate()" type="submit">Update</button>
        </mat-card-actions>
    }

    </mat-card-content>
    
</form>
